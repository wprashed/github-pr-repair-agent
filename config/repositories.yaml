repositories:
- name: WordPress-ai
  github: WordPress/ai
  enabled: true
  pull_requests:
    only_my_prs: true
    only_open_prs: true
  checks:
    test: []
    lint: []
    static_analysis: []
    security: []
    build: []
  safety:
    max_files_changed: 20
    max_lines_added: 1000
    max_lines_deleted: 1000
    allow_new_files: true
    allow_deleted_files: false
    allow_workflow_changes: false
  repair:
    max_attempts: 3
    retry_failed_repairs: true
