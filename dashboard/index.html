<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRRepair • Autonomous GitHub PR Repair Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Modern SaaS Icons ---
    const IconPR = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/>
      </svg>
    );

    const IconRepo = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/>
      </svg>
    );

    const IconCpu = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>
      </svg>
    );

    const IconShield = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const IconAlert = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const IconSearch = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    );

    const IconSettings = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    );

    const IconRefresh = ({ spinning }) => (
      <svg className={`w-4 h-4 ${spinning ? "animate-spin" : ""}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/>
      </svg>
    );

    const IconGitBranch = () => (
      <svg className="w-3.5 h-3.5 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>
      </svg>
    );

    const IconSparkles = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    const IconExternal = () => (
      <svg className="w-3 h-3 opacity-60 group-hover:opacity-100 transition-opacity shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    );

    const IconGitHubLogo = () => (
      <svg className="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
    );

    const IconTable = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>
      </svg>
    );

    const IconGrid = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
      </svg>
    );

    function App() {
      const [stats, setStats] = useState(null);
      const [prs, setPrs] = useState([]);
      const [selectedPr, setSelectedPr] = useState(null);
      const [repairs, setRepairs] = useState([]);
      const [filterStatus, setFilterStatus] = useState("ALL");
      const [searchTerm, setSearchTerm] = useState("");
      const [loading, setLoading] = useState(false);
      const [actionMsg, setActionMsg] = useState("");
      const [viewMode, setViewMode] = useState("table"); // "table" or "cards"
      const [activeNav, setActiveNav] = useState("prs"); // "prs", "repos", "agent", "settings"

      // Settings State
      const [integrations, setIntegrations] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [ghAuthMode, setGhAuthMode] = useState("device");
      const [ghToken, setGhToken] = useState("");
      const [ghUser, setGhUser] = useState("");
      const [agProvider, setAgProvider] = useState("antigravity");
      const [agBin, setAgBin] = useState("");
      const [agModel, setAgModel] = useState("flash");
      const [agAuthStatus, setAgAuthStatus] = useState(null);

      // GitHub Device Flow State
      const [deviceFlow, setDeviceFlow] = useState(null);
      const [devicePolling, setDevicePolling] = useState(false);
      const [devicePollMsg, setDevicePollMsg] = useState("");
      const [deviceInitError, setDeviceInitError] = useState(null);
      const [deviceSuccessUser, setDeviceSuccessUser] = useState(null);
      const [copiedCode, setCopiedCode] = useState(false);
      const pollingRef = useRef(false);
      const pollInFlightRef = useRef(false);

      // Repositories State
      const [settingsTab, setSettingsTab] = useState("github");
      const [monitoredRepos, setMonitoredRepos] = useState([]);
      const [userGhRepos, setUserGhRepos] = useState([]);
      const [loadingRepos, setLoadingRepos] = useState(false);
      const [loadingUserGhRepos, setLoadingUserGhRepos] = useState(false);
      const [newRepoInput, setNewRepoInput] = useState("");
      const [addingRepo, setAddingRepo] = useState(false);
      const [discoveringPrs, setDiscoveringPrs] = useState(false);
      const [autoDiscoverResult, setAutoDiscoverResult] = useState(null);
      const [selectedRepoFilter, setSelectedRepoFilter] = useState("ALL");

      const [ghTestResult, setGhTestResult] = useState(null);
      const [agTestResult, setAgTestResult] = useState(null);
      const [testingGh, setTestingGh] = useState(false);
      const [testingAg, setTestingAg] = useState(false);
      const [savingSettings, setSavingSettings] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [confirmModal, setConfirmModal] = useState(null);

      const showToast = (message, type = "success") => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      const requestPrRepair = (pr) => {
        if (!pr) return;
        const repo = pr.repository || pr.repo_full_name || "";
        if (repo.toLowerCase().includes("themeum")) {
          showToast("Themeum repositories are permanently blocked from repairs.", "error");
          return;
        }
        setConfirmModal({
          title: "Trigger Autonomous Repair",
          target: `#${pr.pr_number} • ${pr.title}`,
          repo: repo,
          description: `Are you sure you want to start an autonomous repair cycle for PR #${pr.pr_number} on ${repo}? The AI agent will inspect failed checks, diagnose root causes, and prepare verified code changes.`,
          confirmLabel: "Start Repair",
          type: "primary",
          onConfirm: () => {
            setConfirmModal(null);
            handleTriggerRepair(pr.id);
          },
        });
      };

      const fetchStatus = async () => {
        try {
          const res = await fetch("/api/status");
          if (res.ok) setStats(await res.json());
        } catch (e) { console.error(e); }
      };

      const fetchPrs = async () => {
        try {
          let url = "/api/pull-requests";
          const params = [];
          if (filterStatus !== "ALL") params.push(`status=${filterStatus}`);
          if (selectedRepoFilter !== "ALL") params.push(`repo=${encodeURIComponent(selectedRepoFilter)}`);
          if (params.length > 0) url += `?${params.join("&")}`;

          const res = await fetch(url);
          if (res.ok) setPrs(await res.json());
        } catch (e) { console.error(e); }
      };

      const fetchRepositories = async () => {
        setLoadingRepos(true);
        try {
          const res = await fetch("/api/repositories");
          if (res.ok) setMonitoredRepos(await res.json());
        } catch (e) { console.error(e); }
        finally { setLoadingRepos(false); }
      };

      const fetchUserGhRepos = async () => {
        setLoadingUserGhRepos(true);
        try {
          const res = await fetch("/api/github/user/repositories");
          if (res.ok) setUserGhRepos(await res.json());
        } catch (e) { console.error(e); }
        finally { setLoadingUserGhRepos(false); }
      };

      const handleAutoDiscover = async () => {
        setDiscoveringPrs(true);
        setAutoDiscoverResult(null);
        setActionMsg("Scanning GitHub for open PRs...");
        try {
          const res = await fetch("/api/github/auto-discover", { method: "POST" });
          const data = await res.json();
          if (res.ok) {
            setAutoDiscoverResult(data);
            setActionMsg(data.message || `Found ${data.discovered_prs_count} open PRs!`);
            showToast(data.message || `Discovered ${data.discovered_prs_count} pull requests!`, "success");
            await fetchRepositories();
            await fetchStatus();
            await fetchPrs();
          } else {
            showToast(data.detail || "Auto-discover failed", "error");
          }
        } catch (e) {
          showToast("Error: " + e.message, "error");
        } finally {
          setDiscoveringPrs(false);
        }
      };

      const handleAddRepository = async (repoName) => {
        const repoToAdd = (repoName || newRepoInput).trim();
        if (!repoToAdd || !repoToAdd.includes("/")) {
          showToast("Please enter repository in owner/repo format (e.g. facebook/react)", "error");
          return;
        }
        setAddingRepo(true);
        try {
          const res = await fetch("/api/repositories", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ github: repoToAdd }),
          });
          const data = await res.json();
          if (res.ok) {
            setNewRepoInput("");
            showToast(`Repository ${repoToAdd} added successfully!`, "success");
            await fetchRepositories();
            await fetchStatus();
            await fetchPrs();
          } else {
            showToast(data.detail || "Failed to add repository", "error");
          }
        } catch (e) {
          showToast("Error: " + e.message, "error");
        } finally {
          setAddingRepo(false);
        }
      };

      const handleToggleRepo = async (github) => {
        try {
          const res = await fetch(`/api/repositories/${github}/toggle`, { method: "POST" });
          if (res.ok) {
            await fetchRepositories();
            await fetchStatus();
          }
        } catch (e) { console.error(e); }
      };

      const handleRemoveRepo = (github) => {
        setConfirmModal({
          title: "Remove Monitored Repository",
          target: github,
          description: `Are you sure you want to remove "${github}" from monitored repositories? The agent will stop tracking pull requests for this repository.`,
          confirmLabel: "Remove Repository",
          type: "danger",
          onConfirm: async () => {
            setConfirmModal(null);
            try {
              const res = await fetch(`/api/repositories/${github}`, { method: "DELETE" });
              if (res.ok) {
                showToast(`Removed repository ${github}`, "info");
                await fetchRepositories();
                await fetchStatus();
                await fetchPrs();
              }
            } catch (e) {
              showToast("Failed to remove repository", "error");
            }
          },
        });
      };

      const fetchIntegrations = async () => {
        try {
          const res = await fetch("/api/settings/integrations");
          if (res.ok) {
            const data = await res.json();
            setIntegrations(data);
            if (!ghUser && data.github.username) setGhUser(data.github.username);
            if (!agBin && data.antigravity.bin_path) setAgBin(data.antigravity.bin_path);
            if (data.antigravity.model) setAgModel(data.antigravity.model);
            if (data.antigravity.provider) setAgProvider(data.antigravity.provider);
          }
        } catch (e) { console.error(e); }
      };

      const fetchAgAuth = async () => {
        try {
          const res = await fetch("/api/auth/antigravity/status");
          if (res.ok) setAgAuthStatus(await res.json());
        } catch (e) { console.error(e); }
      };

      const pollOnce = async (flow) => {
        if (!flow || !flow.device_code) return false;
        if (pollInFlightRef.current) return false;
        pollInFlightRef.current = true;
        try {
          const res = await fetch("/api/auth/github/device/poll", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              client_id: flow.client_id,
              device_code: flow.device_code,
            }),
          });
          const data = await res.json();

          if (data.success) {
            pollingRef.current = false;
            setDevicePolling(false);
            setDeviceFlow(null);
            setDeviceSuccessUser(data.user || { login: data.username });
            setDevicePollMsg(`Authenticated as @${data.username}!`);
            await fetchIntegrations();
            await fetchStatus();
            return true;
          } else if (data.pending) {
            if (data.error === "slow_down") {
              setDevicePollMsg(`Waiting: checking every ${data.interval || 10}s...`);
            } else {
              setDevicePollMsg("Waiting for your authorization in browser...");
            }
            return false;
          } else {
            pollingRef.current = false;
            setDevicePolling(false);
            setDeviceFlow(null);
            setDeviceInitError(`Authorization ended: ${data.error_description || data.error}`);
            return true;
          }
        } catch (e) {
          console.error("Device poll error:", e);
          return false;
        } finally {
          pollInFlightRef.current = false;
        }
      };

      const startDeviceFlow = async () => {
        setDeviceFlow(null);
        setDeviceSuccessUser(null);
        setDeviceInitError(null);
        setDevicePollMsg("Requesting authorization code from GitHub...");
        setDevicePolling(true);
        pollingRef.current = true;
        try {
          const res = await fetch("/api/auth/github/device/start", { method: "POST" });
          const data = await res.json();
          if (res.ok && data.user_code && data.verification_uri) {
            setDeviceFlow(data);
            setDevicePollMsg("Waiting for your authorization in browser...");

            const intervalSec = Math.max(data.interval || 5, 5);
            const runLoop = async () => {
              if (!pollingRef.current) return;
              const done = await pollOnce(data);
              if (!done && pollingRef.current) {
                setTimeout(runLoop, intervalSec * 1000);
              }
            };
            setTimeout(runLoop, intervalSec * 1000);
          } else {
            setDeviceInitError(data.error || "Failed to initiate device authorization.");
            setDevicePolling(false);
            pollingRef.current = false;
          }
        } catch (e) {
          setDeviceInitError("Error initiating authorization: " + e.message);
          setDevicePolling(false);
          pollingRef.current = false;
        }
      };

      const cancelDeviceFlow = () => {
        pollingRef.current = false;
        setDevicePolling(false);
        setDeviceFlow(null);
        setDeviceInitError(null);
      };

      const disconnectGitHub = () => {
        setConfirmModal({
          title: "Disconnect GitHub Account",
          target: integrations?.github?.username ? `@${integrations.github.username}` : null,
          description: "Are you sure you want to disconnect your GitHub account? Active synchronization and background repository scans will be paused until you reconnect.",
          confirmLabel: "Disconnect Account",
          type: "danger",
          onConfirm: async () => {
            setConfirmModal(null);
            try {
              await fetch("/api/auth/github/disconnect", { method: "POST" });
              setDeviceSuccessUser(null);
              setDeviceFlow(null);
              setGhToken("");
              setGhUser("");
              setGhTestResult(null);
              showToast("GitHub account disconnected.", "info");
              await fetchIntegrations();
              await fetchStatus();
            } catch (e) {
              showToast("Failed to disconnect: " + e.message, "error");
            }
          },
        });
      };

      useEffect(() => {
        fetchStatus();
        fetchPrs();
        fetchIntegrations();
        fetchAgAuth();
        fetchRepositories();
        const interval = setInterval(() => {
          fetchStatus();
          fetchPrs();
        }, 5000);
        return () => clearInterval(interval);
      }, [filterStatus, selectedRepoFilter]);

      useEffect(() => {
        if (isSettingsOpen) {
          fetchRepositories();
          if (integrations?.github?.token_configured) {
            fetchUserGhRepos();
          }
        }
      }, [isSettingsOpen]);

      const handleScanNow = async () => {
        setLoading(true);
        setActionMsg("Triggering immediate scan across all repositories...");
        try {
          await fetch("/api/scan", { method: "POST" });
          setTimeout(() => {
            fetchStatus();
            fetchPrs();
            setActionMsg("Scan completed.");
            showToast("Repository scan completed.", "success");
            setLoading(false);
          }, 2000);
        } catch (e) {
          setActionMsg("Scan trigger failed.");
          showToast("Failed to trigger scan.", "error");
          setLoading(false);
        }
      };

      const openPrDetails = async (pr) => {
        setSelectedPr(pr);
        try {
          const prDetailRes = await fetch(`/api/pull-requests/${pr.id}`);
          if (prDetailRes.ok) setSelectedPr(await prDetailRes.json());
          const repairsRes = await fetch(`/api/pull-requests/${pr.id}/repairs`);
          if (repairsRes.ok) setRepairs(await repairsRes.json());
        } catch (e) { console.error(e); }
      };

      const handleApprove = async (prId) => {
        try {
          const res = await fetch(`/api/pull-requests/${prId}/approve`, { method: "POST" });
          const data = await res.json();
          showToast(data.message || "Approved!", "success");
          openPrDetails(selectedPr);
          fetchPrs();
        } catch (e) { showToast("Failed to approve", "error"); }
      };

      const handleTriggerRepair = async (prId) => {
        try {
          const res = await fetch(`/api/pull-requests/${prId}/repair`, { method: "POST" });
          const data = await res.json();
          showToast(data.message || "Repair Queued!", "info");
          fetchPrs();
        } catch (e) { showToast("Failed to trigger repair", "error"); }
      };

      const testGitHub = async () => {
        setTestingGh(true);
        setGhTestResult(null);
        try {
          const res = await fetch("/api/settings/test-github", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: ghToken, username: ghUser }),
          });
          const data = await res.json();
          setGhTestResult(data);
        } catch (e) {
          setGhTestResult({ success: false, error: e.message });
        } finally {

                          <input
                            type="text"
                            value={newRepoInput}
                            onChange={(e) => setNewRepoInput(e.target.value)}
                            onKeyDown={(e) => { if (e.key === "Enter") handleAddRepository(); }}
                            placeholder="owner/repo (e.g. wprashed/my-repo or WordPress/gutenberg)"
                            className="flex-1 bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-mono"
                          />
                          <button
                            type="button"
                            onClick={() => handleAddRepository()}
                            disabled={addingRepo}
                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xs transition disabled:opacity-50"
                          >
                            {addingRepo ? "Adding..." : "+ Add & Scan"}
                          </button>
                        </div>
                      </div>

                      {/* Monitored Repositories List */}
                      <div className="bg-slate-50/70 border border-slate-200 rounded-xl p-4 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-900">Monitored Repositories ({monitoredRepos.length})</span>
                          <button
                            type="button"
                            onClick={fetchRepositories}
                            className="text-xs font-bold text-indigo-600 hover:text-indigo-800"
                          >
                            Refresh
                          </button>
                        </div>

                        {monitoredRepos.length === 0 ? (
                          <div className="p-4 text-center text-xs text-slate-500">
                            No repositories configured. Click "Auto-Discover All PRs" above or enter a repository name.
                          </div>
                        ) : (
                          <div className="space-y-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                            {monitoredRepos.map((repo) => (
                              <div key={repo.github} className="flex items-center justify-between p-2.5 bg-white border border-slate-200 rounded-xl text-xs shadow-2xs">
                                <div className="flex items-center gap-2.5">
                                  <span className={`w-2 h-2 rounded-full ${repo.enabled ? "bg-emerald-500" : "bg-slate-300"}`}></span>
                                  <div>
                                    <a
                                      href={`https://github.com/${repo.github}`}
                                      target="_blank"
                                      rel="noreferrer"
                                      className="font-mono text-slate-900 hover:text-indigo-600 font-bold"
                                    >
                                      {repo.github} ↗
                                    </a>
                                    <div className="text-[11px] text-slate-500 font-medium">
                                      {repo.only_my_prs ? "Only author's PRs" : "All PRs"} • {repo.pr_count || 0} open PR(s) monitored
                                    </div>
                                  </div>
                                </div>
                                <div className="flex items-center gap-2">
                                  <button
                                    type="button"
                                    onClick={() => handleToggleRepo(repo.github)}
                                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border ${repo.enabled ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-slate-100 text-slate-600 border-slate-200"}`}
                                  >
                                    {repo.enabled ? "Enabled" : "Disabled"}
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => handleRemoveRepo(repo.github)}
                                    className="text-slate-400 hover:text-rose-600 p-1 text-sm transition"
                                    title="Remove from monitoring"
                                  >
                                    🗑
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* User's GitHub Repositories (Quick-add) */}
                      {userGhRepos.length > 0 && (
                        <div className="bg-slate-50/70 border border-slate-200 rounded-xl p-4 space-y-3">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-slate-800">Quick-Add from Your GitHub Repositories</span>
                            <span className="text-[11px] text-slate-500 font-medium">{userGhRepos.length} repos found</span>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar">
                            {userGhRepos.slice(0, 20).map((r) => (
                              <div key={r.full_name} className="flex items-center justify-between p-2 bg-white border border-slate-200 rounded-xl text-xs shadow-2xs">
                                <div className="truncate pr-2">
                                  <div className="font-mono text-slate-900 truncate text-[11px] font-bold">{r.full_name}</div>
                                  <div className="text-[10px] text-slate-500">{r.private ? "Private" : "Public"} {r.open_issues_count > 0 ? `• ${r.open_issues_count} open issue(s)/PR(s)` : ""}</div>
                                </div>
                                {r.is_monitored ? (
                                  <span className="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded border border-emerald-200 shrink-0">Monitored</span>
                                ) : (
                                  <button
                                    type="button"
                                    onClick={() => handleAddRepository(r.full_name)}
                                    className="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-lg text-[10px] border border-indigo-200 shrink-0 transition"
                                  >
                                    + Monitor
                                  </button>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Antigravity Connection Box */}
                  {settingsTab === "antigravity" && (
                    <div className="bg-slate-50/70 border border-slate-200 rounded-xl p-4">
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-900 text-sm">Antigravity AI Agent</span>
                          {integrations?.antigravity?.binary_exists && (
                            <span className="text-[10px] bg-emerald-100 text-emerald-800 border border-emerald-300 px-2 py-0.5 rounded font-bold flex items-center gap-1">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                              Binary Ready
                            </span>
                          )}
                          {agAuthStatus?.session_active && (
                            <span className="text-[10px] bg-blue-100 text-blue-800 border border-blue-300 px-2 py-0.5 rounded font-bold">
                              Session Active
                            </span>
                          )}
                        </div>
                        <span className="text-xs text-slate-500 font-mono">Provider: {agProvider}</span>
                      </div>

                      {agAuthStatus && (
                        <div className="mb-3 p-2.5 rounded-xl bg-white border border-slate-200 text-xs flex items-center justify-between shadow-2xs">
                          <div className="flex items-center gap-2">
                            <span className="text-slate-500">Auth Status:</span>
                            <span className={agAuthStatus.authenticated ? "text-emerald-700 font-bold" : "text-amber-700 font-bold"}>
                              {agAuthStatus.authenticated ? "Authenticated (CLI / Session)" : "Unauthenticated"}
                            </span>
                          </div>
                          <span className="text-[11px] text-slate-500 font-mono">
                            {agAuthStatus.binary_path || "Not found"}
                          </span>
                        </div>
                      )}

                      <div className="space-y-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Agent Provider</label>
                          <select
                            value={agProvider}
                            onChange={(e) => setAgProvider(e.target.value)}
                            className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-medium"
                          >
                            <option value="antigravity">Google Antigravity (agentapi)</option>
                            <option value="mock">Mock Coding Agent (Simulation / Dry-run)</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Antigravity Binary Path</label>
                          <input
                            type="text"
                            value={agBin}
                            onChange={(e) => setAgBin(e.target.value)}
                            placeholder="/Users/rashed/.gemini/antigravity/bin/agentapi"
                            className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-mono"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Model Selection</label>
                          <select
                            value={agModel}
                            onChange={(e) => setAgModel(e.target.value)}
                            className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-medium"
                          >
                            <option value="flash">Gemini Flash (Default - Balanced)</option>
                            <option value="flash_lite">Gemini Flash Lite (Ultra-fast)</option>
                            <option value="pro">Gemini Pro (Complex reasoning & large refactors)</option>
                          </select>
                        </div>

                        {/* Antigravity Test Result */}
                        {agTestResult && (
                          <div className={`p-3 rounded-xl text-xs border ${agTestResult.success ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                            {agTestResult.success ? (
                              <div>
                                <div className="font-bold">✔ Antigravity Verified and Ready!</div>
                                <div className="text-[11px] text-slate-600 font-mono mt-1">Binary: {agTestResult.binary_path}</div>
                                <div className="text-[11px] text-slate-600 mt-0.5">Model: {agTestResult.model}</div>
                              </div>
                            ) : (
                              <div>✘ Antigravity test failed: {agTestResult.error}</div>
                            )}
                          </div>
                        )}

                        <div className="flex justify-end pt-1">
                          <button
                            type="button"
                            onClick={testAntigravity}
                            disabled={testingAg}
                            className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-lg text-xs font-bold transition disabled:opacity-50"
                          >
                            {testingAg ? "Testing..." : "Test Antigravity Connection"}
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Modal Fixed Footer Actions */}
                <div className="flex items-center justify-end gap-3 px-6 py-4 bg-slate-50 border-t border-slate-200 shrink-0">
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-xl text-xs font-bold transition shadow-2xs"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={saveIntegrations}
                    disabled={savingSettings}
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-md shadow-indigo-500/20 disabled:opacity-50"
                  >
                    {savingSettings ? "Saving..." : "Save Integrations"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PR Details Modal */}
          {selectedPr && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full max-h-[90vh] shadow-2xl flex flex-col overflow-hidden">
                {/* Fixed Modal Header */}
                <div className="flex items-start justify-between p-6 pb-4 border-b border-slate-200 shrink-0 bg-white">
                  <div>
                    <a
                      href={`https://github.com/${selectedPr.repository}`}
                      target="_blank"
                      rel="noreferrer"
                      className="text-xs text-indigo-600 hover:text-indigo-800 hover:underline font-mono font-bold inline-flex items-center gap-1"
                    >
                      <span>{selectedPr.repository}</span>
                      <IconExternal />
                    </a>
                    <h3 className="text-xl font-extrabold text-slate-900 mt-1 tracking-tight">
                      <a
                        href={selectedPr.url || `https://github.com/${selectedPr.repository}/pull/${selectedPr.pr_number}`}
                        target="_blank"
                        rel="noreferrer"
                        className="hover:text-indigo-600 hover:underline inline-flex items-center gap-2"
                      >
                        <span>#{selectedPr.pr_number}: {selectedPr.title}</span>
                        <IconExternal />
                      </a>
                    </h3>
                    <div className="flex items-center gap-3 mt-2.5 flex-wrap">
                      {getStatusBadge(selectedPr.status)}
                      <span className="text-xs text-slate-600 font-medium">Branch: <code className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded-md border border-slate-200">{selectedPr.branch}</code></span>
                      <span className="text-xs text-slate-600 font-medium">Author: <strong className="text-slate-800">@{selectedPr.author}</strong></span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => requestPrRepair(selectedPr)}
                      className="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition inline-flex items-center gap-1.5 shadow-sm shadow-indigo-500/20"
                    >
                      <IconCpu />
                      <span>Repair PR</span>
                    </button>
                    <button
                      onClick={() => setSelectedPr(null)}
                      className="text-slate-400 hover:text-slate-700 text-sm p-1.5 rounded-lg hover:bg-slate-100 transition"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Scrollable Modal Content */}
                <div className="p-6 overflow-y-auto flex-1 custom-scrollbar space-y-6">
                  {/* Actions bar */}
                  <div className="flex items-center gap-3 pb-2 border-b border-slate-100 flex-wrap">
                    <a
                      href={selectedPr.url || `https://github.com/${selectedPr.repository}/pull/${selectedPr.pr_number}`}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition inline-flex items-center gap-2 shadow-xs"
                    >
                      <IconGitHubLogo />
                      <span>View on GitHub ↗</span>
                    </a>
                    {selectedPr.status === "REQUIRES_HUMAN_REVIEW" && (
                      <button
                        onClick={() => {
                          setConfirmModal({
                            title: "Approve & Push Fix",
                            target: `#${selectedPr.pr_number} • ${selectedPr.title}`,
                            description: "Approve the verified fix and push the commit directly to the branch on GitHub?",
                            confirmLabel: "Approve & Push",
                            type: "primary",
                            onConfirm: async () => {
                              setConfirmModal(null);
                              handleApprove(selectedPr.id);
                            }
                          });
                        }}
                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20 inline-flex items-center gap-1.5"
                      >
                        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                        <span>Approve & Push Fix</span>
                      </button>
                    )}
                    <button
                      onClick={() => requestPrRepair(selectedPr)}
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition inline-flex items-center gap-2 shadow-md shadow-indigo-500/25 active:scale-95"
                    >
                      <IconCpu />
                      <span>Repair PR</span>
                    </button>
                  </div>

                  {/* Latest Diff */}
                  {selectedPr.latest_diff && (
                    <div>
                      <h4 className="text-xs font-bold text-slate-900 tracking-wider uppercase mb-2">Latest Verified Diff</h4>
                      <pre className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs overflow-x-auto text-emerald-400 leading-relaxed max-h-72 shadow-inner font-mono">
                        {selectedPr.latest_diff}
                      </pre>
                    </div>
                  )}

                  {/* Repair History */}
                  <div>
                    <h4 className="text-xs font-bold text-slate-900 tracking-wider uppercase mb-3">Repair History</h4>
                    {repairs.length === 0 ? (
                      <div className="text-xs text-slate-500 py-3 bg-slate-50 rounded-xl text-center border border-slate-200/60">
                        No repair attempts recorded yet.
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {repairs.map(rep => (
                          <div key={rep.id} className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs shadow-2xs">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-slate-900">Attempt #{rep.attempt_number}</span>
                              <span className={`font-bold px-2 py-0.5 rounded text-[11px] ${rep.status === "SUCCESS" ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"}`}>{rep.status}</span>
                            </div>
                            <div className="text-slate-600 mt-1 font-medium">Trigger: {rep.trigger_reason}</div>
                            {rep.commit_sha && (
                              <div className="text-slate-500 mt-1 font-mono">Commit: {rep.commit_sha}</div>
                            )}
                            {rep.error_message && (
                              <div className="text-rose-700 mt-2 bg-rose-50 p-2.5 rounded-lg border border-rose-200 font-medium">
                                {rep.error_message}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modern SaaS Confirmation Modal */}
          {confirmModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center p-4 animate-in fade-in duration-200">
              <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full shadow-2xl p-6 sm:p-7 scale-100 transition-all">
                {/* Modal Header */}
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                      confirmModal.type === "danger" 
                        ? "bg-rose-50 text-rose-600 border border-rose-200" 
                        : "bg-indigo-50 text-indigo-600 border border-indigo-200"
                    }`}>
                      {confirmModal.type === "danger" ? (
                        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                      ) : (
                        <IconCpu />
                      )}
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-slate-900 tracking-tight">
                        {confirmModal.title}
                      </h3>
                      {confirmModal.repo && (
                        <span className="text-[11px] font-mono text-slate-500 font-medium">{confirmModal.repo}</span>
                      )}
                    </div>
                  </div>
                  <button
                    onClick={() => setConfirmModal(null)}
                    className="text-slate-400 hover:text-slate-700 text-sm p-1 rounded-lg hover:bg-slate-100 transition shrink-0"
                  >
                    ✕
                  </button>
                </div>

                {/* Target context chip/box */}
                {confirmModal.target && (
                  <div className="mt-4 p-3 bg-slate-50 border border-slate-200/80 rounded-xl text-xs font-mono font-semibold text-slate-800 break-words leading-relaxed shadow-2xs">
                    {confirmModal.target}
                  </div>
                )}

                {/* Description Text */}
                <p className="mt-3 text-xs text-slate-600 leading-relaxed break-words">
                  {confirmModal.description}
                </p>

                {/* Action Buttons */}
                <div className="flex items-center justify-end gap-2.5 mt-6 pt-4 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setConfirmModal(null)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={confirmModal.onConfirm}
                    className={`px-5 py-2 rounded-xl text-xs font-bold transition shadow-md flex items-center gap-1.5 active:scale-95 ${
                      confirmModal.type === "danger"
                        ? "bg-rose-600 hover:bg-rose-700 text-white shadow-rose-600/20"
                        : "bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-600/20"
                    }`}
                  >
                    <span>{confirmModal.confirmLabel || "Confirm"}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modern SaaS Toast Notifications */}
          <div className="fixed bottom-6 right-6 z-[100] flex flex-col gap-2.5 pointer-events-none max-w-sm w-full">
            {toasts.map(toast => (
              <div
                key={toast.id}
                className={`pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-md transition-all duration-300 ${
                  toast.type === "success"
                    ? "bg-slate-900/95 text-white border-slate-700/80 shadow-slate-900/30"
                    : toast.type === "error"
                    ? "bg-rose-950/95 text-white border-rose-800/80 shadow-rose-950/30"
                    : "bg-slate-900/95 text-white border-slate-700/80 shadow-slate-900/30"
                }`}
              >
                <div className="flex items-center gap-2.5">
                  {toast.type === "success" && (
                    <div className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                      </svg>
                    </div>
                  )}
                  {toast.type === "error" && (
                    <div className="w-5 h-5 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center shrink-0">
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                      </svg>
                    </div>
                  )}
                  {toast.type === "info" && (
                    <div className="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                      </svg>
                    </div>
                  )}
                  <span className="text-xs font-semibold leading-snug">{toast.message}</span>
                </div>
                <button
                  onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))}
                  className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition text-xs shrink-0"
                >
                  ✕
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
